# tkan.yaml - example configuration. Save it as ./tkan.yaml or pass it with
# `-c FILE` / $TKAN_CONFIG. Reference: docs/config.md

# Optional: the backend `add` creates in and bare IDs refer to ($TKAN_BACKEND overrides).
# default_backend: tasks

# Audit trail of reloads and writes (press A in the board, or run `tkan audit`).
# Kept in memory unless a file is set; .jsonl or .csv, relative to this file.
# audit:
#   file: audit.jsonl
#   max_size: 1024    # KiB; past it the file is moved to audit.jsonl.1 (default: grows forever)

# Optional, off by default: store the details of every action run (command, stdin, stdout, stderr,
# times, exit status), one of:
# action_log:
#   file: actions.jsonl   # one JSON object per run, appended (relative to this file)
#   dir: actions          # or one JSON file per run in actions/<action>/
# Private files (0600); env values are never stored; keep them out of version control.
# View them with R in the board or `tkan runs`. The audit trail only keeps a one-line summary.

# Actions: commands run on the selected task (press x in the board, or `tkan run NAME ID`).
# `command` is a list, never a shell line; {id} {title} {description} {status} {priority} {notes}
# {type} {assignee} {due} {start} {labels} {blocked_by} {backend} {json} are replaced by the task's values.
# The environment also gets TKAN_TASK_ID, TKAN_TASK_TITLE, TKAN_TASK_STATUS, TKAN_BACKEND, TKAN_WORKDIR, TKAN_TASK_JSON.
# `cwd` and `env` values take {id}, {backend} and {slug} (cwd: only these). For one checkout per task, create
# a worktree in the command: [sh, -c, 'git worktree add -B "tkan/$1-$2" "../wt/$1" && cd "../wt/$1" && exec claude "$3"', sh, "{id}", "{slug}", "{title}"]
#   mode     background (default: OK/FAIL in the status line) | interactive (gets the terminal)
#   stdin    none (default) | json | markdown   (not with interactive; hooks also: event | event-markdown)
#   timeout  background only, default 10s;  cwd  relative to this file;  key  picker shortcut
#   kill_grace  SIGTERM, then SIGKILL after this (default 5s; 0s = at once);  max_output  KiB kept of each stream (256)
#   interactive_timeout  limit for interactive runs (default none);  exclusive  true = one background run per card
#   capture  notes = append the first capture_max KiB (default 4) of stdout to the task's notes
#   on_success / on_failure  column or status to move the task to when a run ends well / badly;
#                or {status: Done, append_notes: stdout|summary} / {status: Blocked, append_notes: error}
#   claim    true = claim the task (assignee + lease) for the run and release it after (needs assignee and lease columns)
# actions:
#   - name: notify
#     command: [notify-send, "tkan #{id}", "{title}"]
#   - name: claude
#     key: c
#     label: Work on it with Claude
#     mode: interactive
#     command: [claude, "Work on tkan task {id}: {title}\n\n{description}"]
#   - name: plan
#     stdin: markdown
#     show: output           # open the output (live in the R view) when the run ends
#     notify: desktop        # or bell: tell me when it ends (default: only "N finished (R)" on screen)
#     timeout: 120s
#     command: [claude, -p, "Write an implementation plan for the task on stdin"]
# Mark cards with space and press x to run an action on all of them (in the background); this many go at once:
# action_max_parallel: 2   # default 2, 1..16

# Task text that starts with "-" is parsed as an option by the program: put `--` before it
# (command: [tool, --, "{title}"]) or pass untrusted text with `stdin: markdown`.
# Placeholders are never shell-parsed, unless you put them inside a shell script: in
# [sh, -c, 'echo {title}'] the title is shell code ($(...), ;). Pass values as arguments instead:
# [sh, -c, 'echo "$1"', sh, "{title}"] (or use "$TKAN_TASK_TITLE"); tkan warns about the unsafe form.

# Hooks: commands started by events, with no key press (see docs/config.md#hooks). Same command
# syntax as actions, plus {event} {source} {error} {old_status} {old_json} {action}
# {column} {old_column} {new_status}; env TKAN_EVENT, TKAN_EVENT_SOURCE, TKAN_EVENT_ERROR, TKAN_OLD_STATUS,
# TKAN_OLD_TASK_JSON, TKAN_ACTION, TKAN_COLUMN, TKAN_OLD_COLUMN, TKAN_NEW_STATUS.
#   on    task.create|update|delete[.success|.fail]  task.moved  task.appeared  task.disappeared
#         task.entered.COLUMN  task.left.COLUMN  task.due (TUI)  column.wip_exceeded (TUI)
#         reload.ok  reload.fail  action.started  action.finished  action.succeeded  action.failed
#   when  optional filter (docs/filter.md) on the task of the event; not for reload.*
#   max_depth  optional per-hook limit, can only lower hook_max_depth
#   max_parallel  runs at once (default 1 when only reload.* events, else unlimited)
#   min_interval  least time between two starts, e.g. 30s (default none)
#   unique  task: skip an event while this hook is still running for the same task (this process only)
#   queue  drop (default) | latest | all: what to do with events over those limits
#   retries  start a failed run again up to N times (0..10, default 0);  retry_delay  wait between (default 1s)
#   dedupe  true: task.appeared/disappeared run once across open boards (marker in .tkan-dedupe/, gitignore it)
#   To POST the event to a URL, use curl with stdin: event (docs/config.md#posting-to-a-url).
# A tkan that a hook runs fires no hooks by default. hook_max_depth: 2 lets one level of follow-up
# hooks fire (max 3); a hook already in TKAN_HOOK_CHAIN never fires again.
# hook_max_depth: 1
# Cap on hook runs at once over all hooks (0 = unlimited, max 64); events over it follow each hook's queue.
# A bulk `set-status 1 2 3 ... doing` otherwise starts one run per task. Skipped events are audited as result=skipped.
# hook_max_parallel: 4
# hooks:
#   - name: notify-high
#     on: [task.create.success, task.moved]
#     when: 'priority=high'
#     command: [notify-send, "{event}: #{id}", "{title} ({old_status} -> {status})"]
#   - name: new-outside
#     on: [task.appeared]            # added by someone else (board only)
#     command: [notify-send, "new task #{id}", "{title}"]
#   - name: broken
#     on: [reload.fail, action.failed]
#     command: [sh, -c, 'echo "$TKAN_EVENT: $TKAN_EVENT_ERROR" >> events.log']
#   - name: chat
#     on: [task.create.success]
#     stdin: event
#     env: {URL: 'https://hooks.example.com/services/T000/B000/XXXX'}   # masked in the audit trail
#     command: [sh, -c, 'curl -fsS -X POST -H "Content-Type: application/json" --data @- "$URL"']
#     retries: 3
#     retry_delay: 5s
#   # Hand a card to an AI agent when it is moved to Doing and assigned to "claude" (see docs/config.md#recipes-ai-agents).
#   # Agents need a real timeout (the default is 10s) and a restricted tool list; the task is on stdin.
#   - name: claude-works-doing
#     on: [task.moved]
#     when: 'status=doing assignee=claude'
#     stdin: event-markdown   # event name, source and old status, then the task
#     timeout: 30m
#     command: [claude, -p, "Work on the task on stdin. When done run: tkan set-status {id} Review",
#               --allowedTools, "Bash(tkan:*),Read,Edit", --max-turns, "30"]

# The backends to show on one board. Each entry has:
#   type     csv | json | jsonl | yaml | custom
#   command  instead of type: an external command (list); the entry is a custom backend
#   name     optional; default is the type plus its 1-based position (csv1, custom2).
#            Cards show it, and `-b NAME` / NAME:ID selects it on the command line.
#   disabled optional; true keeps the entry but skips it (not opened, no cards)
#   options  settings of that type
backend:
  - type: csv
    name: tasks
    options:
      source: tasks.csv   # path relative to this file
      header: true        # false = no header row; then fields MUST be positions
      # poll: watch      # outside edits: watch (check every second) | none (read once; press r) | SECONDS (e.g. 5)
      fields:             # logical field -> column NAME in the header, or 1-based POSITION
        id: id            # required
        title: title      # required
        status: state     # required: the column that decides the kanban column
        description: 4    # optional (name or position)
        priority: priority
        notes: notes
        type: type
        # assignee: owner      # optional: assignee, due, start (YYYY-MM-DD), labels
        # due: due
        # blocked_by: depends_on   # ids (same backend) to finish first: blocked/ready filters, `tkan run` refuses (exit 4, -force)
        # Columns that are not listed here are preserved untouched.
    # Optional: actions and hooks for this backend's tasks only (same fields as the top-level
    # lists). One with the name of a top-level one replaces it here; hooks may not use reload.*.
    # actions:
    #   - name: notify
    #     command: [notify-send, "tasks.csv #{id}", "{title}"]
    # hooks:
    #   - name: moved
    #     on: [task.moved]
    #     command: [sh, -c, 'echo "$1" >> moves.log', sh, "{id} {old_status} -> {status}"]

  # A JSON / JSON Lines / YAML file (an array of task objects).
  # - type: json            # jsonl | yaml work the same way
  #   options:
  #     source: tasks.json
  #     # poll: watch       # watch | none | seconds, as for csv
  #     # path: data.tasks  # json/yaml: where the list is, as dotted keys (default: top level or "tasks")
  #     # fields: {title: summary, status: state}   # where key names differ

  # A SQLite database, through a script (contrib/backends/sqlite/tkan-sqlite.sh; needs bash, jq, sqlite3).
  # - name: tasks
  #   command: [./tkan-sqlite.sh, tasks.db, tasks]   # database file, table
  #   options:
  #     env: {TKAN_SQLITE_FIELDS: "title=summary,status=state"}   # where column names differ
  #     poll: 5s

  # A command that answers a small JSON protocol (see docs/backends.md).
  # - name: tracker
  #   command: [./tracker.sh, --project, demo]   # a command implies type: custom
  #   options:
  #     timeout: 10s
  #     poll: 5s          # optional: seconds or a duration; re-run `list` this often to pick up outside changes (default / none: never; watch means the same as unset here)

board:
  # Columns, left to right. `values` are the raw status values shown in the
  # column (default: just the column name). `write` is what a move into the
  # column stores (default: the first value).
  columns:
    - name: Backlog
      values: [pending, todo, ""]   # "" also catches rows with an empty status
    - name: Doing
      values: [in_progress, wip]
      write: in_progress
      limit: 3                      # optional WIP limit: warn above 3 cards
      color: "#ffaf00"              # optional: header / selected-card colour (0-255 or #rrggbb)
    - name: Done
      values: [done, closed]
    - name: Failed
      values: [failed]
  # What to do with raw values no column claims:
  #   append (default) one extra column per value, after the configured ones
  #   other            one trailing "other" column
  #   hide             do not show those cards
  unmapped: append
  # Fields a plain filter term (`/` in the board, `list -q`) is matched against.
  # Default shown. Any field, including unmapped CSV columns by name, can be
  # listed here and targeted explicitly in a filter: priority=high col:doing
  search: [id, title, description, notes]
  # Group the cards of each column (z cycles it on the board): priority, type, assignee, labels, ...
  # group: priority
  # Assignee names of AI agents: their cards get a coloured border and a bold @name.
  # agents: [claude, codex]
  # Pictures of the agents in the fleet view (F, `tkan fleet`); a busy agent cycles its frames.
  # avatars:
  #   claude: ["🤖", "🦾"]
  # Saved filters: `v` cycles them on the board, `tkan list -v NAME` applies one.
  views:
    - {name: urgent, query: "priority=high col!:done"}
  # Display order of the cards in each column; backends are never changed.
  # `-` = descending; a list gives an explicit order. `s` / `S` in the board try others.
  # sort: [priority: [high, medium, low], -id]
