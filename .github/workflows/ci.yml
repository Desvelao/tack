name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: gofmt, vet, tests
        run: make check
      - name: race detector
        run: make race

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum
      - name: vet everything, test the file locking and the portable packages
        working-directory: src
        run: |
          go vet ./...
          go test ./internal/backend/filestore/ ./internal/pathenv ./internal/board ./internal/task ./internal/query ./internal/claim ./internal/workers ./internal/outcome
