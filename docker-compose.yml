name: tkan

x-dev: &dev
  build:
    context: .
    target: dev
  image: tkan-dev
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /app/src
  volumes:
    - .:/app
    - gomod:/go/pkg/mod
    - gocache:/go-cache

services:
  # Interactive shell / TUI runs: `docker compose run --rm dev go run ./cmd/tkan /app/tasks.csv`
  dev:
    <<: *dev
    stdin_open: true
    tty: true

  test:
    <<: *dev
    command: go test ./...

  # Race detector over the packages that run goroutines (needs cgo, hence its own image).
  race:
    <<: *dev
    build:
      context: .
      target: race
    image: tkan-race
    command: go test -race ./internal/action ./internal/actionlog ./internal/audit ./internal/backend/... ./internal/proc ./internal/hook ./internal/tui ./cmd/tkan

  # Static binary into ./bin. Cross-compile with GOOS/GOARCH/GOARM and OUT, see Makefile.
  build:
    <<: *dev
    environment:
      GOOS: ${GOOS:-linux}
      GOARCH: ${GOARCH:-amd64}
      GOARM: ${GOARM:-}
    command: go build -trimpath -ldflags="-s -w -X main.version=${VERSION:-dev} -X main.buildDate=${BUILD_DATE:-}" -o /app/${OUT:-bin/tkan} ./cmd/tkan

volumes:
  gomod:
  gocache:
