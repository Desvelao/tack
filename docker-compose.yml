name: tack

x-dev: &dev
  build:
    context: .
    target: dev
  image: tack-dev
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  working_dir: /app/src
  volumes:
    - .:/app
    - gomod:/go/pkg/mod
    - gocache:/go-cache

services:
  # Interactive shell / TUI runs: `docker compose run --rm dev go run ./cmd/tack /app/tasks.csv`
  dev:
    <<: *dev
    stdin_open: true
    tty: true

  test:
    <<: *dev
    command: go test ./...

  # Race detector over every package, so a new one that starts goroutines is covered
  # without editing this line (needs cgo, hence its own image).
  race:
    <<: *dev
    build:
      context: .
      target: race
    image: tack-race
    command: go test -race ./...

  # Static binary into ./bin. Cross-compile with GOOS/GOARCH/GOARM and OUT, see Makefile.
  build:
    <<: *dev
    environment:
      GOOS: ${GOOS:-linux}
      GOARCH: ${GOARCH:-amd64}
      GOARM: ${GOARM:-}
    command: go build -trimpath -ldflags="-s -w -X main.version=${VERSION:-dev} -X main.buildDate=${BUILD_DATE:-}" -o /app/${OUT:-bin/tack} ./cmd/tack

volumes:
  gomod:
  gocache:
